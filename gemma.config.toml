model = "gemma-4"
model_provider = "remote"
model_reasoning_effort = "minimal"
model_reasoning_summary = "none"
model_verbosity = "low"
model_supports_reasoning_summaries = false
web_search = "live"
personality = "pragmatic"
approval_policy = "never"
sandbox_mode = "danger-full-access"
approvals_reviewer = "auto_review"

model_context_window = 262000
model_auto_compact_token_limit = 240000

[model_providers.remote]
name = "Remote LLM"
base_url = "https://studio.yanun.net/v1"
wire_api = "responses"
env_key = "MLX_API_KEY"
stream_idle_timeout_ms = 600000

[features]
fast_mode = false
multi_agent = false
js_repl = true
hooks = true



[[skills.config]]
path = "~/.codex/skills/.system/skill-creator/SKILL.md"
enabled = false

[[skills.config]]
path = "~/.codex/skills/.system/skill-installer/SKILL.md"
enabled = true

[[skills.config]]
path = "~/.codex/skills/.system/plugin-creator/SKILL.md"
enabled = false

[[skills.config]]
path = "~/.codex/skills/.system/imagegen/SKILL.md"
enabled = false

[[skills.config]]
path = "~/.codex/skills/skill-gemini-design/SKILL.md"
enabled = false

[[skills.config]]
path = "~/.codex/skills/skill-playwright/SKILL.md"
enabled = false

[[skills.config]]
path = "~/.codex/skills/skill-playwright-interactive/SKILL.md"
enabled = false